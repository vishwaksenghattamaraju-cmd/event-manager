<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &bull; The Matrix</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg?v=6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=25">
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <!-- Floating Theme Toggle -->
  <div class="theme-toggle-floating">
    <button id="btn-theme-toggle" class="theme-toggle-btn" title="Toggle Light / Dark Mode" aria-label="Toggle Light / Dark Mode" onclick="UI.toggleTheme()">
      🌙
    </button>
  </div>

  <!-- Minimal Centered Auth Card -->
  <main class="auth-wrapper auth-scene">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-badge">
          <img src="/images/logo.svg?v=6" alt="The Matrix" style="width: 32px; height: 32px; object-fit: contain;">
        </div>
        <h1 class="auth-title">Login</h1>
        <p class="auth-subtitle">Sign in to continue to The Matrix</p>
      </div>

      <!-- Segmented Tabs for Log In / Register -->
      <div class="auth-tabs" role="tablist">
        <div id="tab-login" class="auth-tab active" role="tab" tabindex="0" aria-selected="true">Sign In</div>
        <div id="tab-register" class="auth-tab" role="tab" tabindex="0" aria-selected="false">Register</div>
      </div>

      <!-- Sign In Form -->
      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="login-username">Username or Email</label>
          <input type="text" id="login-username" class="form-input" placeholder="e.g. admin or organizer" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="btn-toggle-password" id="btn-toggle-login-password" aria-label="Show password" title="Show password" aria-pressed="false">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <div id="login-error" class="auth-error-banner" style="display: none;"></div>
        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block">Login</button>

        <!-- Permanent Demo Login Section -->
        <div class="auth-demo-box" id="auth-demo-box" aria-label="Demo Login Credentials">
          <div class="auth-demo-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <span class="auth-demo-label" style="margin-bottom: 0;">⚡ 1-Click Demo Credentials:</span>
            <span style="font-size: 0.72rem; color: var(--text-dim);">Click to autofill</span>
          </div>
          <div class="auth-demo-chips">
            <button type="button" class="btn btn-secondary btn-sm" id="btn-fill-admin" title="Autofill Administrator (admin / Admin@123)">
              👑 <strong>Admin</strong> <span style="opacity: 0.8; font-size: 0.7rem; margin-left: 0.2rem;">(Full Access)</span>
            </button>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-fill-organizer" title="Autofill Event Organizer (organizer / Organizer@123)">
              📋 <strong>Organizer</strong> <span style="opacity: 0.8; font-size: 0.7rem; margin-left: 0.2rem;">(Events & Inventory)</span>
            </button>
          </div>
          <div class="auth-demo-creds-hint" style="margin-top: 0.55rem; font-size: 0.72rem; color: var(--text-muted); border-top: 1px dashed var(--border-color); padding-top: 0.45rem; display: flex; flex-direction: column; gap: 0.2rem;">
            <div>👑 <strong>Admin:</strong> <code>admin</code> &bull; <code>Admin@123</code></div>
            <div>📋 <strong>Organizer:</strong> <code>organizer</code> &bull; <code>Organizer@123</code></div>
          </div>
        </div>
      </form>

      <!-- Register Form -->
      <form id="form-register" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="e.g. event_host" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="host@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-role">Account Role</label>
          <select id="reg-role" class="form-select">
            <option value="organizer" selected>Event Organizer</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password (min 8 chars)</label>
          <div class="password-input-wrapper">
            <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
            <button type="button" class="btn-toggle-password" id="btn-toggle-reg-password" aria-label="Show password" title="Show password" aria-pressed="false">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <div id="reg-error" class="auth-error-banner" style="display: none;"></div>
        <button type="submit" id="btn-reg-submit" class="btn btn-primary btn-block">Create Organizer Account</button>
      </form>

      <div class="auth-footer">
        Secure Session Authentication &bull; Role-Based Access Control
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js?v=12"></script>
</body>
</html>
