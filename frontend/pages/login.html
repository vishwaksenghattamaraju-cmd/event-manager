<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login &bull; Event Inventory AI</title>
  <link rel="icon" type="image/png" href="/images/logo.svg?v=6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=14">
  <link rel="stylesheet" href="/css/bg-video.css?v=6">
  <script>
    (function() {
      const saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body data-bg-video="login">
  <div class="theme-toggle-floating" style="position: fixed; top: 1.25rem; right: 1.25rem; z-index: 100;">
    <button id="btn-theme-toggle" class="theme-toggle-btn" title="Toggle Light / Dark Mode" onclick="UI.toggleTheme()">
      🌙
    </button>
  </div>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/images/logo.svg?v=6" alt="Event Inventory AI Logo" class="auth-logo-img">
        <h1 class="auth-title">Event Inventory AI</h1>
        <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 0.25rem;">Smarter Inventory. Smoother Events.</p>
      </div>

      <div class="auth-tabs">
        <div id="tab-login" class="auth-tab active">Log In</div>
        <div id="tab-register" class="auth-tab">Register</div>
      </div>

      <!-- Login Form -->
      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="login-username">Username or Email</label>
          <input type="text" id="login-username" class="form-input" placeholder="e.g. admin or organizer1" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="login-error" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
        <button type="submit" id="btn-login-submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        
        <div style="margin-top: 1.25rem; padding: 0.75rem 0.85rem; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 0.8rem;">
          <div style="font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; display: flex; align-items: center; justify-content: space-between;">
            <span>⚡ Instant Demo Logins:</span>
          </div>
          <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
            <button type="button" class="btn btn-secondary btn-sm" id="btn-fill-admin" style="font-size: 0.75rem; padding: 0.35rem 0.6rem;">👑 Admin</button>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-fill-organizer" style="font-size: 0.75rem; padding: 0.35rem 0.6rem;">📋 Organizer</button>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-fill-vishwak" style="font-size: 0.75rem; padding: 0.35rem 0.6rem;">👤 Vishwak</button>
          </div>
        </div>
      </form>

      <!-- Register Form -->
      <form id="form-register" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="e.g. event_lead" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-role">Account Role</label>
          <select id="reg-role" class="form-select">
            <option value="organizer" selected>📋 Event Organizer</option>
            <option value="admin">👑 Administrator</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password (min 8 chars, 1 number)</label>
          <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <div id="reg-error" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
        <button type="submit" id="btn-reg-submit" class="btn btn-primary" style="width: 100%;">Create Organizer Account</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-dim);">
        Secure Session Authentication &bull; Role-Based Access Control
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
  <script src="/js/bg-video.js?v=1"></script>
</body>
</html>
