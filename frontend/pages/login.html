<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &bull; Event Inventory AI</title>
  <link rel="icon" type="image/svg+xml" href="/images/logo.svg?v=6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=22">
  <script>
    (function() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <!-- Floating Theme Toggle -->
  <div class="theme-toggle-floating">
    <button id="btn-theme-toggle" class="theme-toggle-btn" title="Toggle Light / Dark Mode" aria-label="Toggle Light / Dark Mode" onclick="UI.toggleTheme()">
      🌙
    </button>
  </div>

  <!-- Minimal Centered Auth Card -->
  <main class="auth-wrapper auth-scene">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-badge">
          <img src="/images/logo.svg?v=6" alt="Event Inventory AI" style="width: 32px; height: 32px; object-fit: contain;">
        </div>
        <h1 class="auth-title">Login</h1>
        <p class="auth-subtitle">Sign in to continue to Event Inventory AI</p>
      </div>

      <!-- Segmented Tabs for Log In / Register -->
      <div class="auth-tabs" role="tablist">
        <div id="tab-login" class="auth-tab active" role="tab" tabindex="0" aria-selected="true">Sign In</div>
        <div id="tab-register" class="auth-tab" role="tab" tabindex="0" aria-selected="false">Register</div>
      </div>

      <!-- Sign In Form -->
      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="login-username">Username or Email</label>
          <input type="text" id="login-username" class="form-input" placeholder="e.g. admin or organizer" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="login-error" class="auth-error-banner" style="display: none;"></div>
        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-block">Login</button>

        <!-- 1-Click Demo Logins -->
        <div class="auth-demo-box">
          <div class="auth-demo-label">⚡ 1-Click Demo Credentials:</div>
          <div class="auth-demo-chips">
            <button type="button" class="btn btn-secondary btn-sm" id="btn-fill-admin">👑 Admin</button>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-fill-organizer">📋 Organizer</button>
          </div>
        </div>
      </form>

      <!-- Register Form -->
      <form id="form-register" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <input type="text" id="reg-username" class="form-input" placeholder="e.g. event_host" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="host@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-role">Account Role</label>
          <select id="reg-role" class="form-select">
            <option value="organizer" selected>📋 Event Organizer</option>
            <option value="admin">👑 Administrator</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Password (min 8 chars)</label>
          <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <div id="reg-error" class="auth-error-banner" style="display: none;"></div>
        <button type="submit" id="btn-reg-submit" class="btn btn-primary btn-block">Create Organizer Account</button>
      </form>

      <div class="auth-footer">
        Secure Session Authentication &bull; Role-Based Access Control
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
